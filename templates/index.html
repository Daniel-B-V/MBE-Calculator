<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MBE Calculator — Petroleum Engineering</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- ── HEADER ─────────────────────────────────────────── -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <div>
          <h1 class="brand-title">MBE Calculator</h1>
        </div>
      </div>
      <nav class="tab-bar" aria-label="Primary">
        <button class="tab-btn active" data-tab="calculator">Calculator</button>
        <button class="tab-btn" data-tab="graphing">Graphing</button>
        <button class="tab-btn" data-tab="parameters">Parameters</button>
      </nav>
      <div class="header-actions">
        <label class="theme-switch" title="Toggle color theme" aria-label="Toggle color theme">
          <input id="theme-toggle" type="checkbox" />
          <span class="theme-slider"></span>
        </label>
      </div>
    </div>
  </header>

  <!-- ═════════════════════════════════════════════════════=
       CALCULATOR TAB
  ═════════════════════════════════════════════════════=
  -->
  <section class="tab-panel active" id="tab-calculator">
    <div class="calc-layout">

      <!-- Main panel (cards shown here) -->
      <div class="calc-main" id="calc-main">
        <div class="placeholder-msg">
          Select an equation to begin
        </div>
      </div>

    </div>
  </section>

  <!-- ═════════════════════════════════════════════════════=
       GRAPHING TAB WITH COMPUTED COLUMNS
  ═════════════════════════════════════════════════════=
  -->
  <section class="tab-panel" id="tab-graphing">
    <div class="graph-layout">
      <button id="btn-toggle-sidebar" class="btn-sm sidebar-toggle" aria-label="Toggle sidebar">
        <i class="fa fa-chevron-left" aria-hidden="true"></i>
      </button>

      <!-- Controls sidebar -->
      <aside class="graph-sidebar">
        <div class="sidebar-block">
          <p class="sidebar-label">AXIS CONFIGURATION</p>
          <div class="input-row">
            <label>X Label</label>
            <input type="text" id="g-xlabel" value="x" class="txt-input" />
          </div>
          <div class="input-row">
            <label>Y Label</label>
            <input type="text" id="g-ylabel" value="y" class="txt-input" />
          </div>
          <div class="input-row">
            <label>Slope Symbol</label>
            <input type="text" id="g-slope-sym" value="m" class="txt-input short" />
          </div>
          <div class="input-row">
            <label>Graph Title</label>
            <input type="text" id="g-title" value="Oil &amp; Gas Material Balance Linear Function" class="txt-input" />
          </div>
        </div>

        <!-- X-AXIS COLUMNS SECTION -->
        <div class="sidebar-block">
          <p class="sidebar-label">X-AXIS COLUMNS</p>
          <div id="x-columns-container" class="columns-container"></div>
          <button id="btn-add-x-column" class="btn-sm accent2" style="margin-top: 8px;">Add X Column</button>
        </div>

        <!-- Y-AXIS COLUMNS SECTION -->
        <div class="sidebar-block">
          <p class="sidebar-label">Y-AXIS COLUMNS</p>
          <div id="y-columns-container" class="columns-container"></div>
          <button id="btn-add-y-column" class="btn-sm accent2" style="margin-top: 8px;">Add Y Column</button>
        </div>

        <button id="btn-plot" class="btn-primary full-width">Plot Graph</button>
        <div id="slope-display" class="slope-display"></div>
      </aside>

      <!-- Chart area -->
      <div class="graph-main">
        <canvas id="mbe-chart"></canvas>
      </div>

    </div>
  </section>

  <!-- ═════════════════════════════════════════════════════=
       PARAMETERS TAB
  ═════════════════════════════════════════════════════=
  -->
  <section class="tab-panel" id="tab-parameters">
    <div class="params-container">
      <div class="params-header">
        <h2>Parameters &amp; Units Reference</h2>
        <div class="search-box">
          <input type="text" id="param-search" placeholder="Search symbol, description, or unit…" class="txt-input" />
        </div>
      </div>
      <div class="table-wrap">
        <table class="param-table">
          <thead>
            <tr>
              <th>Symbol</th>
              <th>Description</th>
              <th>Unit</th>
            </tr>
          </thead>
          <tbody id="param-tbody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <script src="/static/js/app.js"></script>
</body>
</html>
